version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/video-platform-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      js-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
